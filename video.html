<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kavya — Your Dream</title>


<!-- GOOGLE FONTS -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    overflow:hidden;

    position:relative;

    color:#eafaff;

    font-family:'Montserrat',sans-serif;

    background:

        radial-gradient(
            circle at 50% 18%,
            rgba(115,220,255,.22) 0%,
            rgba(60,170,220,.10) 24%,
            transparent 52%
        ),

        radial-gradient(
            circle at 10% 80%,
            rgba(80,200,245,.13),
            transparent 38%
        ),

        linear-gradient(
            180deg,
            #020507 0%,
            #030b10 45%,
            #010305 100%
        );
}


/* =====================================================
   BACKGROUND GLOW
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    left:50%;
    top:12%;

    transform:translateX(-50%);

    background:rgba(95,210,255,.10);

    filter:blur(90px);

    border-radius:50%;

    pointer-events:none;

    z-index:0;
}


/* =====================================================
   STARS
===================================================== */

.stars{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:1;
}


.star{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#c9f5ff;

    box-shadow:

        0 0 5px rgba(150,230,255,.9),

        0 0 10px rgba(90,210,255,.35);

    animation:
        twinkle 3s ease-in-out infinite;
}


@keyframes twinkle{

    0%,
    100%{

        opacity:.25;

        transform:scale(.8);
    }

    50%{

        opacity:1;

        transform:scale(1.5);
    }
}


/* =====================================================
   MOON
===================================================== */

.moon{

    position:fixed;

    top:42px;

    right:8%;

    width:70px;
    height:70px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #f4fdff 0%,
            #bceeff 48%,
            #76d5f7 100%
        );

    box-shadow:

        0 0 25px rgba(110,220,255,.45),

        0 0 70px rgba(80,200,245,.20);

    opacity:.9;

    z-index:2;
}


.moon::after{

    content:"";

    position:absolute;

    width:70px;
    height:70px;

    border-radius:50%;

    top:-8px;
    left:18px;

    background:#03090d;
}


/* =====================================================
   MAIN
===================================================== */

.main{

    position:relative;

    z-index:5;

    height:100vh;

    min-height:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:

        25px

        20px

        50px;

    overflow:hidden;
}


/* =====================================================
   VIDEO WRAPPER
===================================================== */

.video-wrapper{

    position:relative;

    width:300px;

    height:600px;

    margin-top:0;

    padding:1px;

    border-radius:20px;

    background:

        linear-gradient(

            145deg,

            rgba(190,240,255,.55),

            rgba(70,190,235,.18),

            rgba(150,230,255,.45)

        );

    box-shadow:

        0 0 12px rgba(80,210,255,.16),

        0 0 35px rgba(50,180,230,.08),

        0 15px 45px rgba(0,0,0,.60);

    overflow:hidden;

    animation:
        videoGlow 4s ease-in-out infinite;
}


/* =====================================================
   VIDEO GLOW
===================================================== */

@keyframes videoGlow{

    0%,
    100%{

        box-shadow:

            0 0 12px rgba(80,210,255,.14),

            0 0 35px rgba(50,180,230,.07),

            0 15px 45px rgba(0,0,0,.60);
    }


    50%{

        box-shadow:

            0 0 18px rgba(90,220,255,.24),

            0 0 45px rgba(50,190,240,.12),

            0 15px 45px rgba(0,0,0,.60);
    }
}


/* =====================================================
   VIDEO INNER
===================================================== */

.video-inner{

    width:100%;

    height:100%;

    background:#000;

    border-radius:19px;

    overflow:hidden;

    position:relative;
}


/* =====================================================
   VIDEO
===================================================== */

video{

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:19px;

    background:#000;
}


/* =====================================================
   LIGHT BLUE SHINE
===================================================== */

.video-wrapper::before{

    content:"";

    position:absolute;

    width:150%;

    height:18px;

    left:-25%;

    top:45%;

    background:

        linear-gradient(

            90deg,

            transparent,

            rgba(190,245,255,.22),

            transparent

        );

    transform:rotate(-45deg);

    animation:
        shine 5s linear infinite;

    z-index:10;

    pointer-events:none;
}


@keyframes shine{

    0%{

        transform:
            translateX(-100%)
            rotate(-45deg);
    }


    45%,
    100%{

        transform:
            translateX(100%)
            rotate(-45deg);
    }
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    margin-top:18px;

    text-align:center;

    max-width:430px;

    padding:0 20px;

    flex-shrink:0;
}


.message-main{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:27px;

    line-height:1.2;

    font-weight:500;

    color:#d9f7ff;

    text-shadow:
        0 0 12px rgba(100,220,255,.18);
}


.message-main span{

    color:#a9eaff;

    font-style:italic;
}


/* =====================================================
   MAGIC BUTTON
===================================================== */

.next-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:14px;

    padding:12px 25px;

    min-width:190px;

    border-radius:40px;

    border:
        1px solid
        rgba(150,230,255,.48);

    color:#dff9ff;

    text-decoration:none;

    font-size:12px;

    font-weight:500;

    letter-spacing:1.4px;

    background:

        linear-gradient(

            135deg,

            rgba(105,210,245,.16),

            rgba(20,100,130,.12)

        );

    box-shadow:

        0 0 18px rgba(70,200,245,.13),

        inset 0 0 15px rgba(130,225,250,.05);

    backdrop-filter:blur(10px);

    transition:.3s ease;
}


.next-btn:hover{

    transform:translateY(-3px);

    border-color:
        rgba(180,240,255,.85);

    background:

        linear-gradient(

            135deg,

            rgba(105,210,245,.25),

            rgba(20,120,155,.18)

        );

    box-shadow:

        0 0 25px
        rgba(80,210,255,.28);
}


.arrow{

    margin-left:9px;

    font-size:16px;

    color:#9fe8ff;
}


/* =====================================================
   OCEAN WAVES
===================================================== */

.ocean{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:150px;

    overflow:hidden;

    pointer-events:none;

    z-index:2;

    opacity:.8;
}


.wave{

    position:absolute;

    bottom:-45px;

    left:-10%;

    width:120%;

    height:100px;

    border-radius:
        50% 50% 0 0;

    border-top:
        1px solid
        rgba(115,220,250,.20);

    animation:
        waveMove 7s ease-in-out infinite;
}


.wave:nth-child(2){

    bottom:-65px;

    opacity:.55;

    animation-duration:10s;

    animation-delay:-2s;
}


.wave:nth-child(3){

    bottom:-82px;

    opacity:.35;

    animation-duration:13s;

    animation-delay:-4s;
}


@keyframes waveMove{

    0%,
    100%{

        transform:
            translateX(-2%)
            scaleX(1);
    }


    50%{

        transform:
            translateX(2%)
            scaleX(1.03);
    }
}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.heart{

    position:fixed;

    bottom:-30px;

    color:
        rgba(130,225,250,.25);

    font-size:13px;

    pointer-events:none;

    animation:
        heartFloat linear infinite;

    z-index:3;
}


@keyframes heartFloat{

    0%{

        transform:
            translateY(0)
            rotate(0deg);

        opacity:0;
    }


    15%{

        opacity:.45;
    }


    80%{

        opacity:.25;
    }


    100%{

        transform:
            translateY(-105vh)
            rotate(25deg);

        opacity:0;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .main{

        height:100vh;

        padding:

            20px

            15px

            35px;

        justify-content:center;
    }


    .moon{

        width:55px;

        height:55px;

        top:28px;

        right:8%;
    }


    .moon::after{

        width:55px;

        height:55px;

        left:14px;

        top:-6px;
    }


    .video-wrapper{

        width:300px;

        height:auto;

        aspect-ratio:9 / 16;

        max-width:90vw;

        max-height:68vh;

        border-radius:20px;
    }


    .video-inner,
    video{

        border-radius:19px;
    }


    .message{

        margin-top:14px;

        padding:0 10px;
    }


    .message-main{

        font-size:23px;
    }


    .next-btn{

        margin-top:11px;

        padding:11px 21px;

        min-width:180px;
    }
}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:330px){

    .video-wrapper{

        width:270px;

        max-width:86vw;

        max-height:65vh;
    }


    .message-main{

        font-size:21px;
    }


    .next-btn{

        margin-top:9px;
    }
}

</style>

</head>
